name = "datazmws"
pages_build_output_dir = "frontend/dist"
compatibility_date = "2026-08-05"

[vars]
VITE_STATIC_DATA_BASE = "/data"
# 服务器 API 地址。玩家查询、反馈、战场计算、运维接口会继续走服务器。
VITE_SERVER_API_BASE = "https://api.zmwsrank.top"
# 访问统计默认走同源 Pages Functions。临时切回旧服务器时再填写这个值。
VITE_VISITOR_API_BASE = ""
QA_BASE_URL = "https://x666.me/v1"
QA_MODEL_ORDER = "gemini-3.7-flash,grok-4.5,grok-4.6"
# 纯 Cloudflare Pages 架构，全量使用同源静态 JSON 资料检索，不依赖外部 catalog
QA_CATALOG_BASE = ""

# D1 绑定名固定为 VISITOR_STATS_DB，Pages Functions 代码会读取 env.VISITOR_STATS_DB。
[[d1_databases]]
binding = "VISITOR_STATS_DB"
database_name = "zmws-visitor-stats"
database_id = "f06392c5-e00e-4d82-84b9-d3f2d9fa9eaa"
