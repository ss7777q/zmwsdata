    <ellipse cx="60.5" cy="80" rx="28.5" ry="10" fill="#ff9a37" stroke-width="5"/>
    <ellipse cx="60.5" cy="78" rx="21" ry="5.5" fill="#ffd36b" stroke="none" opacity="0.65"/>
    <path d="M39 91c12 6 34 6 44 0" fill="none" stroke="#ffca61" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
  </g>

  <g aria-label="修炼" filter="url(#textLift)" font-family="'Microsoft YaHei UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="34" font-weight="900" letter-spacing="-1">
    <text x="61" y="134" text-anchor="middle" stroke="#1e1514" stroke-width="9" stroke-linejoin="round" paint-order="stroke fill" fill="#1e1514">修炼</text>
    <text x="61" y="134" text-anchor="middle" stroke="#2d6c52" stroke-width="5" stroke-linejoin="round" paint-order="stroke fill" fill="#fff2c5">修炼</text>
    <text x="61" y="134" text-anchor="middle" fill="#fff6d4">修炼</text>
  </g>
