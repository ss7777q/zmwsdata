<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 122 147" role="img" aria-labelledby="title desc">
  <title id="title">修炼图标</title>
  <desc id="desc">手绘风格的修炼道具图标，包含青绿色叶片、橙色丹炉和三瓣火焰。</desc>
  <defs>
    <linearGradient id="bg" x1="10" y1="10" x2="116" y2="141" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d6d48f"/>
      <stop offset="0.55" stop-color="#83ad68"/>
      <stop offset="1" stop-color="#4f7a44"/>
    </linearGradient>
    <radialGradient id="aura" cx="63" cy="57" r="46" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#35fff0" stop-opacity="0.75"/>
      <stop offset="0.5" stop-color="#2bc6b7" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#12352f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leaf" x1="18" y1="68" x2="104" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f6f66"/>
      <stop offset="0.55" stop-color="#23c0a5"/>
      <stop offset="1" stop-color="#0a6d65"/>
    </linearGradient>
    <linearGradient id="bowl" x1="35" y1="74" x2="86" y2="113" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffb33f"/>
      <stop offset="0.48" stop-color="#ff8131"/>
      <stop offset="1" stop-color="#c94b21"/>
    </linearGradient>
    <linearGradient id="flameLeft" x1="28" y1="22" x2="44" y2="68" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff077"/>
      <stop offset="0.55" stop-color="#ff9b45"/>
      <stop offset="1" stop-color="#e15125"/>
    </linearGradient>
    <linearGradient id="flameCenter" x1="45" y1="12" x2="78" y2="72" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff58d"/>
      <stop offset="0.38" stop-color="#ffb64c"/>
      <stop offset="0.72" stop-color="#ff7040"/>
      <stop offset="1" stop-color="#0ec3c4"/>
    </linearGradient>
    <linearGradient id="flameRight" x1="69" y1="18" x2="93" y2="68" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff184"/>
      <stop offset="0.45" stop-color="#ffb148"/>
      <stop offset="0.72" stop-color="#2bd6c9"/>
      <stop offset="1" stop-color="#089a9a"/>
    </linearGradient>
    <filter id="softShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="2.2" flood-color="#1c1715" flood-opacity="0.55"/>
    </filter>
    <filter id="ink" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1" flood-color="#120f0e" flood-opacity="0.8"/>
    </filter>
    <filter id="textLift" x="-20%" y="-40%" width="140%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="1" flood-color="#0c1713" flood-opacity="0.95"/>
    </filter>
  </defs>

  <rect width="122" height="147" rx="8" fill="url(#bg)"/>
  <path d="M-9 35C15 16 31 38 54 30c25-8 41-26 72-15v132H-9Z" fill="#274f35" opacity="0.24"/>
  <path d="M0 118c20-16 34-4 52-13 24-12 44-25 70-8v50H0Z" fill="#2d6a43" opacity="0.35"/>
  <circle cx="63" cy="60" r="47" fill="url(#aura)"/>

