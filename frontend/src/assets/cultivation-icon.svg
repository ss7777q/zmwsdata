    <path d="M106 89c-13 8-31 2-39-13 18-7 35-2 39 13Z" fill="url(#leaf)"/>
    <path d="M31 94c7-17 22-22 38-15-8 18-21 25-38 15Z" fill="#19a98e"/>
    <path d="M91 94c-17 10-33 3-40-15 19-4 33 1 40 15Z" fill="#18a78e"/>
    <path d="M21 84c10 2 18 0 27-7" fill="none" stroke="#53e0c1" stroke-width="2.2"/>
