    <path d="M17 83c-9-4-12-13-7-20 5-8 18-12 29-7 11 4 16 14 11 22-5 9-22 11-33 5Z" fill="#1d1a18"/>
    <path d="M85 80c-3-10 5-20 17-21 10-1 18 6 18 16 0 11-10 21-22 20-7 0-11-6-13-15Z" fill="#1d1a18"/>
  </g>

