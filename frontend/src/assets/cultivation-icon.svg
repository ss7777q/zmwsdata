    <path d="M51 77c-14-15-22-25-15-41 5-11 17-16 26-9 9 8 5 23-11 50Z" fill="url(#flameLeft)" stroke-width="5"/>
    <path d="M62 78c-21-17-31-34-20-51 7-12 23-13 31-2 11 14 6 31-11 53Z" fill="url(#flameCenter)" stroke-width="5.5"/>
    <path d="M71 76c-8-25-2-43 11-48 12-4 22 7 20 20-3 15-15 23-31 28Z" fill="url(#flameRight)" stroke-width="5"/>
    <path d="M47 33c-6 6-8 15-5 24" fill="none" stroke="#ffe77e" stroke-width="3" opacity="0.9"/>
    <path d="M64 24c8 6 11 16 8 29" fill="none" stroke="#ffe785" stroke-width="3" opacity="0.88"/>
    <path d="M85 33c8 7 8 17 1 28" fill="none" stroke="#ffe37a" stroke-width="3" opacity="0.85"/>
  </g>

  <g stroke="#211715" stroke-linejoin="round" filter="url(#ink)">
